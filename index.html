<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Typeleft</title>
  </head>

  <body>
    <div id="root"><p style="padding:40px;font-family:sans-serif;color:#666;">Loading Typeleft...</p></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('root').innerHTML = '<pre style="padding:40px;font-family:monospace;color:red;white-space:pre-wrap;">' + (error?.stack || msg) + '</pre>';
        return true;
      };
      window.onunhandledrejection = function(event) {
        document.getElementById('root').innerHTML = '<pre style="padding:40px;font-family:monospace;color:red;white-space:pre-wrap;">Unhandled Rejection:\n' + (event.reason?.stack || event.reason) + '</pre>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
